<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutina</title>
<meta name="description" content="Tu rutina de gimnasio: registro de pesos, constancia y progreso. Funciona sin internet.">
<meta name="theme-color" content="#F2F2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Aplica el tema guardado antes de pintar, para que no haya parpadeo */
(function () {
  var t = 'brasa', m = 'auto';
  try { var s = JSON.parse(localStorage.getItem('rutina.v1') || 'null'); if (s && s.settings) { t = s.settings.theme || t; m = s.settings.mode || m; } } catch (e) {}
  var dark = m === 'dark' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<main id="view"></main>
<div id="bbar"></div>
<nav id="tabbar" aria-label="Secciones"></nav>
<div id="sheet"></div>
<noscript>Esta app necesita JavaScript activado.</noscript>
<script src="parser.js"></script>
<script src="assets.js"></script>
<script src="app.js"></script>
</body>
</html>
